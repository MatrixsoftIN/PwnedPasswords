name: nuget

# Release (MinVer + SemVer): git tag v2.0.0 && git push origin v2.0.0
# Pre-release: git tag v2.0.0-preview.1 && git push origin v2.0.0-preview.1
#
# nuget.org Trusted Publishing policy (workflow file name only): nuget.yml
#   Repository owner: MatrixsoftIN | Repository: PwnedPasswords | Environment: nuget
# GitHub environment "nuget": secret NUGET_USER = nuget.org profile name (not email).

on:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - src/**
      - tests/**
      - Directory.Build.props
      - Directory.Packages.props
      - .github/workflows/nuget.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Matrixsoft.PwnedPasswords.slnx -c Release --nologo

      - name: Test
        run: dotnet test Matrixsoft.PwnedPasswords.slnx -c Release --no-build --nologo

      - name: Pack
        # Library project only: the MVC sample must never ship as a package.
        run: dotnet pack src/PwnedPasswords/PwnedPasswords.csproj -c Release --no-build -o ./nupkgs --nologo

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Matrixsoft.PwnedPasswords.slnx -c Release --nologo

      - name: Test
        run: dotnet test Matrixsoft.PwnedPasswords.slnx -c Release --no-build --nologo

      - name: Pack
        # Library project only: the MVC sample must never ship as a package.
        run: dotnet pack src/PwnedPasswords/PwnedPasswords.csproj -c Release --no-build -o ./nupkgs --nologo

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
